# Reference/template manifest for Mynah (formerly "AI Passthrough") — one
# install per persona. Copy this folder's built binary + this file into
# Concord's Plugins/<Name>/ directory (e.g. Plugins/Burt/, Plugins/Alice/),
# then edit [plugin].id/name and [process.env] per install. See
# 10 Projects/AI Passthrough/AI Passthrough - Plan.md in the Obsidian vault
# for the full design.

[plugin]
id      = "Burt"
name    = "Burt"
product = "Mynah"
version = "0.1.0"

[process]
restart_on_crash        = true
max_restarts            = 5
restart_backoff_seconds = 5

# Only genuine local secrets/files live here — never touches Concord's DB
# or Settings UI. GATEWAY_API_KEY is this install's own credential for
# whatever AI gateway it's pointed at (Hermes' own API server, OpenClaw,
# OpenAI, OpenRouter, a local LLM server — anything OpenAI-compatible);
# PERSONA_DOC_PATH is content-writing work, not yet in place.
#
# The gateway endpoint URL and model name are NOT configured here anymore
# — an admin sets those live via Concord's Settings > Plugins UI
# (gateway_endpoint/gateway_model below), no file edit or restart needed.
# Leaving gateway_endpoint blank there runs this install in echo mode —
# useful for verifying the relay path with zero AI-gateway infra.
[process.env]
PERSONA_LABEL    = "Burt"
# GATEWAY_API_KEY  = ""
# PERSONA_DOC_PATH = "persona.md"

[process.entrypoint.windows]
bin = "mynah-server.exe"
[process.entrypoint.linux]
bin = "mynah-server"
[process.entrypoint.darwin]
bin = "mynah-server"

[[channel_kind]]
kind         = "mynah"
display_name = "Mynah — Burt"
icon         = "◆"
# remote_pane intentionally omitted (defaults false) — this renders as an
# ordinary text channel, not a custom pane. See App.isRemotePaneChannel on
# Concord's client side.

  [[channel_kind.create_field]]
  key     = "rate_limit_burst"
  label   = "Burst limit (messages)"
  type    = "number"
  default = "3"

  [[channel_kind.create_field]]
  key     = "rate_limit_refill_per_hour"
  label   = "Refill rate (messages/hour)"
  type    = "number"
  default = "20"

[[server_config_field]]
key     = "mention_enabled"
label   = "Enable @mention triggering in any channel"
type    = "boolean"
default = "false"

[[server_config_field]]
key     = "mention_trigger"
label   = "Mention trigger word"
type    = "text"
default = "burt"

[[server_config_field]]
key     = "mention_rate_limit_burst"
label   = "Mention-mode burst limit"
type    = "number"
default = "3"

[[server_config_field]]
key     = "mention_rate_limit_refill_per_hour"
label   = "Mention-mode refill rate"
type    = "number"
default = "20"

[[server_config_field]]
key     = "gateway_endpoint"
label   = "AI gateway endpoint URL"
type    = "text"
default = ""

[[server_config_field]]
key     = "gateway_model"
label   = "AI gateway model name"
type    = "text"
default = ""
