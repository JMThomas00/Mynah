# Concord reads this to install and run Mynah. Admins never edit it: the
# settings below appear as forms in Concord (Server Settings > Plugins for
# server_config_field, the channel's own settings for create_field).

[plugin]
id = "mynah"
name = "Mynah"
product = "Mynah"
version = "0.2.0"            # release.go stamps the git tag here
description = "AI personas that chat in a channel (or when @mentioned), streaming their replies."
source_url = "https://github.com/JMThomas00/Mynah"
# One install runs any number of personas ("instances"), each with its own
# name, settings and channels, added from the plugin's page in Concord.
instances = true

[process]
restart_on_crash = true
max_restarts = 5
restart_backoff_seconds = 5

[process.entrypoint.linux]
bin = "mynah"
[process.entrypoint.darwin]
bin = "mynah"
[process.entrypoint.windows]
bin = "mynah.exe"

# A channel Mynah owns: it answers every message posted there.
[[channel_kind]]
kind = "mynah"
display_name = "Mynah"
icon = "◆"
remote_pane = false

  [[channel_kind.create_field]]
  key = "rate_limit_burst"
  label = "Burst limit (messages)"
  type = "number"
  default = "3"
  help = "How many messages one member can send in a row before waiting for the refill"

  [[channel_kind.create_field]]
  key = "rate_limit_refill_per_hour"
  label = "Refill rate (messages/hour)"
  type = "number"
  default = "20"
  help = "How fast each member's allowance comes back"

[[server_config_field]]
key = "gateway_endpoint"
label = "AI endpoint URL"
type = "text"
default = ""
help = "An OpenAI-compatible chat completions URL, e.g. https://api.openai.com/v1/chat/completions. Empty: Mynah just echoes"

[[server_config_field]]
key = "gateway_model"
label = "Model"
type = "text"
default = ""
help = "The model name the endpoint expects, e.g. gpt-4o-mini or llama3.2"

[[server_config_field]]
key = "gateway_api_key"
label = "API key"
type = "secret"
help = "Sent as a Bearer token; leave empty for a local server that needs none"

[[server_config_field]]
key = "persona"
label = "Persona"
type = "text"
default = ""
help = "Instructions that define who Mynah is and how it answers (sent as the system prompt)"

[[server_config_field]]
key = "mention_enabled"
label = "Answer @mentions"
type = "boolean"
default = "false"
help = "Off: only in its own channels. On: also when @mentioned (with no channel of its own, it's @mention only)"

[[server_config_field]]
key = "mention_channels"
label = "Where @mentions work"
type = "channel_multi_select"
default = ""
help = "One channel, a few, or leave empty for every channel"

[[server_config_field]]
key = "mention_trigger"
label = "Mention name"
type = "text"
default = ""
help = "What people @mention, without the @. Empty: its own name (e.g. @Alice)"

[[server_config_field]]
key = "mention_rate_limit_burst"
label = "Mention burst limit"
type = "number"
default = "3"
help = "Like the channel limit, for @mentions"

[[server_config_field]]
key = "mention_rate_limit_refill_per_hour"
label = "Mention refill rate (per hour)"
type = "number"
default = "20"
help = "Like the channel refill, for @mentions"
